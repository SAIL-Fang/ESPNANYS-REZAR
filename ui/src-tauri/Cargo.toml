[package]
name = "sail_ui"
version = "0.1.0"
description = "SAIL headset control UI"
authors = ["SAIL contributors"]
edition = "2021"

[lib]
name = "sail_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
sail_app = { path = "../../sail_app" }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
