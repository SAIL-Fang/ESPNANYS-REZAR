[package]
name = "sail_app"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "SAIL application orchestration shared by the CLI and UI"

[dependencies]
sail_core = { path = "../sail_core" }
sail_hid = { path = "../sail_hid" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
cpal = "0.15"
